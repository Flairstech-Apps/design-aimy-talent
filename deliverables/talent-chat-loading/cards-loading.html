  <style>
/* ══════════════════════════════════════════════════════════════════════
   LOADING STATE FOR THE CONTACT CARDS

   What a person sees between asking and the cards being there:

     1. Thinking   AiMY's mark gets a turning ring, and one status line
                   says what it is doing ("Reading your question").
     2. Searching  The answer takes its final shape at once: two lead
                   lines and a grid of loading cards, the same 264px
                   squares with the same glass and ring, each holding a
                   field of dots that a blue-violet bloom drifts through
                   (after image generation), with a % pill in the corner.
     3. Streaming  Rows arrive in order. Each one floods the next dot
                   field and the real card resolves in its place (no
                   reflow); the status counts them.
     4. Done       The status settles into one quiet line that says where
                   the answer came from. The lead is written, spare
                   skeletons fold away, and "Show N more" appears.

   Tokens below are new; every colour comes from the chat's own tokens.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --sk-bone:   rgba(168, 181, 197, 0.11);
  --sk-sheen:  rgba(190, 200, 255, 0.07);
  --sk-pill:   rgba(23, 26, 31, 0.72);
  --ease-io:   cubic-bezier(0.65, 0, 0.35, 1);
}
:root[data-theme="light"] {
  --sk-bone:   rgba(15, 23, 42, 0.07);
  --sk-sheen:  rgba(255, 255, 255, 0.65);
  --sk-pill:   rgba(255, 255, 255, 0.82);
}

/* ── 1. The mark: a ring turns around it while AiMY works ── */
.msg-av { position: relative; }
.msg-av::before {
  content: ""; position: absolute; inset: -1px; border-radius: 50%; padding: 1.5px;
  background: conic-gradient(from 0deg, transparent 0 52%, var(--talent-ink) 82%, var(--tag-ink) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity 300ms var(--ease);
}
.msg-av.is-working::before { opacity: 1; animation: ld-spin 1.1s linear infinite; }
@keyframes ld-spin { to { transform: rotate(1turn); } }

/* ── The status line ── */
.ld-status {
  display: flex; align-items: center; gap: 0.55rem; min-height: 1.6rem;
  font-size: 0.88rem; font-weight: 500; color: var(--ink-3);
}
.ld-step { display: inline-block; animation: ld-swap 280ms var(--ease) both; }
@keyframes ld-swap { from { opacity: 0; transform: translateY(4px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
/* The words shine while they are live: one band of light crossing them. */
.ld-status:not(.is-done) .ld-step {
  background: linear-gradient(90deg, var(--ink-3) 0 38%, var(--panel-strong) 50%, var(--ink-3) 62% 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: ld-swap 280ms var(--ease) both, ld-shine 2.2s var(--ease-io) infinite;
}
@keyframes ld-shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
.ld-count {
  font-family: var(--mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.04em;
  color: var(--tag-ink); font-variant-numeric: tabular-nums;
}
.ld-count:empty { display: none; }
.ld-check { display: none; width: 0.95rem; height: 0.95rem; color: var(--tag-ink); flex: none; }
/* Done: the line goes quiet and stays, so the answer says where it came from. */
.ld-status.is-done { font-size: 0.78rem; color: var(--ink-4); }
.ld-status.is-done .ld-check { display: block; }
.ld-status.is-done .ld-count { color: var(--ink-4); }
.ld-status.is-warn .ld-check { color: var(--warn); }

/* ── 2. Bones ── */
.sk {
  display: inline-block; vertical-align: middle; height: 0.72em; max-width: 100%;
  border-radius: var(--r-pill); background: var(--sk-bone);
}
/* One band of light sweeps each skeleton, a beat later on each card, so the
   grid reads as one wave rather than eight blinking boxes. Transform only. */
.sk-sheen {
  position: absolute; inset: 0; z-index: 1; overflow: hidden; border-radius: inherit; pointer-events: none;
}
.sk-sheen::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 55%;
  background: linear-gradient(100deg, transparent 10%, var(--sk-sheen) 50%, transparent 90%);
  transform: translateX(-110%);
  animation: sk-sweep 1.9s var(--ease-io) infinite;
  animation-delay: calc(var(--d, 0) * 110ms);
}
@keyframes sk-sweep { 0% { transform: translateX(-110%); } 70%, 100% { transform: translateX(290%); } }

/* The lead: two lines where the sentence will be. */
.ld-lead { position: relative; display: flex; flex-direction: column; gap: 0.62rem; padding: 0.42rem 0; border-radius: var(--r-md); }
.ld-lead .sk { height: 0.72rem; width: min(34rem, 72%); }
.ld-lead .sk + .sk { width: min(20rem, 44%); }

/* The loading card: the card's own shell (glass, ring, lit edge, 264px
   square) holding a field of dots. A blue-violet bloom drifts and breathes
   through the field, the way an image forms before it is there; a % pill
   in the corner says how far along it is. When the row lands, the bloom
   floods the field and the real card resolves out of it. Drawn on a
   canvas, one shared animation frame for every card. */
.sk-card { pointer-events: none; padding: 0; }
.sk-dots { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: inherit; }
.sk-pct {
  position: absolute; right: 0.75rem; bottom: 0.75rem; z-index: 2;
  padding: 0.3rem 0.65rem; border-radius: var(--r-pill);
  background: var(--sk-pill); border: 1px solid var(--card-line-soft);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-size: 0.78rem; font-weight: 700; line-height: 1; color: var(--tag-ink);
  font-variant-numeric: tabular-nums;
}

/* Cells hold the skeleton and the card in the same spot, so a card lands
   exactly where its skeleton was and nothing around it moves. */
.card-cell.is-loading { display: grid; }
.card-cell.is-loading > * { grid-area: 1 / 1; width: var(--card-size); }
.card-cell.is-new { animation: sk-in 320ms var(--ease) both; animation-delay: calc(var(--d, 0) * 45ms); }
@keyframes sk-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── 3. A card arriving ── */
.sk-card.is-out { opacity: 0; transition: opacity 280ms var(--ease); }
/* The card lands just as the bloom peaks, under the fading dots. */
.contact-card.is-landing { animation: card-land 420ms var(--ease) 170ms both; }
@keyframes card-land {
  from { opacity: 0; transform: scale(0.985); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}
/* The score bar fills to its value as the card lands. */
.contact-card.is-landing .fc-score-bar i {
  transform-origin: left center; animation: bar-fill 700ms var(--ease) 320ms both;
}
@keyframes bar-fill { from { transform: scaleX(0); } }

/* Spare skeletons fold away when fewer rows came than were drawn. */
.card-cell.is-gone { animation: sk-gone 260ms var(--ease) forwards; }
@keyframes sk-gone { to { opacity: 0; transform: scale(0.97); } }

/* ── 4. Text and controls arriving ── */
.ld-fade { animation: ld-fade 360ms var(--ease) both; }
@keyframes ld-fade { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.ld-retry { margin-top: 0.15rem; align-self: flex-start; }
.ld-retry svg { width: 0.95rem; height: 0.95rem; }

/* ── Composer: send becomes Stop while AiMY works ── */
.tc-send .i-stop { display: none; width: 0.8rem; height: 0.8rem; fill: currentColor; stroke: none; }
.tc-send[data-busy] .i-send { display: none; }
.tc-send[data-busy] .i-stop { display: block; }
.tc-send[data-busy] { border-color: var(--talent-line); }

/* Reduced motion: no sweep, no turning ring, no shine; data still arrives. */
@media (prefers-reduced-motion: reduce) {
  .sk-sheen, .msg-av::before { display: none; }
  .ld-status:not(.is-done) .ld-step { background: none; color: var(--ink-3); }
}

/* ══ PROTOTYPE PANEL (not part of the product) ═════════════════════════ */
.proto { position: fixed; right: 1.25rem; bottom: 6rem; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
.proto-btn {
  display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.95rem;
  border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line-strong);
  font-size: 0.8rem; font-weight: 700; color: var(--ink-2); box-shadow: var(--shadow);
}
.proto-btn svg { width: 1rem; height: 1rem; }
.proto-btn:hover { color: var(--ink); }
.proto-pop {
  order: -1; width: 18.5rem; padding: 0.95rem; border-radius: var(--r-xl);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 0.7rem;
}
.proto-pop[hidden] { display: none; }
.proto-h { margin: 0; font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); }
.proto-opts { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.proto-opt {
  padding: 0.38rem 0.7rem; border-radius: var(--r-pill); border: 1px solid var(--line);
  font-size: 0.8rem; font-weight: 600; color: var(--ink-2);
}
.proto-opt:hover { border-color: var(--line-strong); color: var(--ink); }
.proto-opt[aria-pressed="true"] { background: var(--tag-bg); border-color: var(--tag-ink); color: var(--tag-ink); }
.proto-desc { margin: 0; font-size: 0.8rem; line-height: 1.45; color: var(--ink-3); min-height: 2.3rem; }
.proto-replay {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.55rem 1rem;
  border-radius: var(--r-pill); background: var(--card-glass); border: 1px solid var(--card-line);
  font-size: 0.84rem; font-weight: 700; color: var(--tag-ink);
}
.proto-replay:hover { background: var(--tag-bg); border-color: var(--tag-ink); }
.proto-replay svg { width: 1rem; height: 1rem; }
@media (max-width: 40rem) { .proto { right: 1rem; bottom: 5.25rem; } .proto-pop { width: min(18.5rem, calc(100vw - 2rem)); } }
  </style>

   cards-loading — the chat between a question and its contact cards.

   No backend: the "agent" is a timer that streams the sample rows. Pick a
   scenario in the Loading states panel (bottom right) and press Replay, or
   ask anything in the box. While AiMY works the send button is Stop.

   ═══════════════════════════════════════════════════════════════════════ */

  (function addSampleContacts() {

  const PREVIEW = 8;

  /* ══ SCENARIOS ═════════════════════════════════════════════════════════
     count     how many rows the search returns
     firstRow  ms from "searching" to the first row
     gap       ms between rows [min, max]
     slowNote  ms after which the status admits it is slow
     holdAt    stop streaming after this many rows (to inspect)
     fail      ms after which the search fails instead of streaming */
  const SCENARIOS = {
    normal: { label: 'Normal', count: 32, firstRow: 900, gap: [45, 120],
      desc: 'Skeletons, then the 32 rows stream in. The first 8 fill the preview.' },
    slow:   { label: 'Slow', count: 32, firstRow: 6500, gap: [70, 160], slowNote: 3200,
      desc: 'Nothing for a few seconds: the status says so plainly. Try Stop.' },
    few:    { label: 'Few results', count: 3, firstRow: 1100, gap: [160, 260],
      desc: 'Three rows. The spare skeletons fold away; no Show more.' },
    none:   { label: 'No results', count: 0, firstRow: 1700, gap: [0, 0],
      desc: 'Nobody matches. The skeletons fold away and AiMY says what to try.' },
    fail:   { label: 'Fails', count: 32, fail: 2200,
      desc: 'The search cannot reach the table. A note and Try again.' },
    hold:   { label: 'Hold', count: 32, firstRow: 900, gap: [180, 260], holdAt: 3,
      desc: 'Freezes after 3 rows so the mixed state can be inspected.' }
  };
  let scenario = 'normal';

  /* ══ RENDERERS ═════════════════════════════════════════════════════════ */
  const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const pad = (n) => String(n).padStart(2, '0');

  /* The real card, exactly as the handoff draws it. */
  function card(c, i, total) {
    const kv = (label, val, href) => `<div class="fc-kv${val ? '' : ' is-none'}"><dt>${label}</dt><dd>${val
      ? (href ? `<a href="${esc(href)}" title="${esc(val)}">${esc(val)}</a>` : `<span title="${esc(val)}">${esc(val)}</span>`)
      : '<span aria-hidden="true">—</span><span class="k-sr">not listed</span>'}</dd></div>`;

      <div class="fc-head">

        <span class="fc-score" style="--p:${c.score}" title="Match score">
          <b>${c.score}<small>%</small></b><span class="k-sr"> match</span>
          <span class="fc-score-bar" aria-hidden="true"><i></i></span>
        </span>
      </div>
      <div class="fc-who"><p class="cand-name">${esc(c.name)}</p><p class="cand-role">${esc(c.title)}</p></div>
      <p class="fc-why"><span class="k-sr">Why it fits: </span>${SPARK}<span title="${esc(c.why)}">${esc(c.why)}</span></p>
      <dl class="fc-ledger">
        ${kv('Company', c.company)}${kv('Location', c.loc)}
        ${kv('Email', c.email, c.email && 'mailto:' + c.email)}${kv('Phone', c.phone, c.phone && 'tel:' + c.phone)}
      </dl>
      <div class="fc-end">
        <a class="fc-link" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" aria-label="View ${esc(c.name)}'s profile">View profile<span aria-hidden="true">↗</span></a>
        <span class="fc-index" aria-hidden="true">${pad(i + 1)}<i>/${pad(total)}</i></span>
      </div>
    </article>`;
  }

  /* The loading card: the card's shell around a field of dots. */
  function skeleton(k) {
    return `<div class="cand contact-card sk-card" aria-hidden="true" style="--d:${k}">
      <canvas class="sk-dots"></canvas><span class="sk-pct">0%</span>
    </div>`;
  }

  /* ══ DOT FIELD ═════════════════════════════════════════════════════════
     Every loading card is a grid of dots, 10px apart. Two soft blobs drift
     through it on slow, different orbits (each card a different phase), a
     faint ring ripples out from the main one, and the edges fall off like a
     vignette. Inside a blob the dots grow and turn blue at the centre,
     violet at the rim; outside it they are barely there.

     The % climbs toward 94 and waits there; it only reaches 100 when the
     row actually arrives. Then the bloom floods the whole field (260ms)
     and the dots fade as the card lands under them.

     One requestAnimationFrame drives all the fields; dots are bucketed by
     brightness so each frame is a dozen fills, not thousands. */
  const fields = new Set();
  let raf = 0, palette = null;
  const still = window.matchMedia('(prefers-reduced-motion: reduce)');
  const LEVELS = 12;

  function hexRgb(h) {
    h = h.trim().replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16));
  }
  function readPalette() {
    const cs = getComputedStyle(document.documentElement);
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    palette = {
      base: light ? '15, 23, 42' : '255, 255, 255',
      baseA: light ? 0.13 : 0.09,
      blue: hexRgb(cs.getPropertyValue('--tag-ink')),
      violet: [139, 79, 244],
      light
    };
  }

  function makeField(skel, k, tau) {
    const cv = skel.querySelector('.sk-dots');
    const f = { skel, cv, ctx: cv.getContext('2d'), k, ph: k * 1.93, born: performance.now() + k * 140,
      tau, p: -1, resolveAt: 0, bloom: 0, pct: skel.querySelector('.sk-pct'), drawn: false };
    sizeField(f);
    fields.add(f);
    skel._field = f;
    loop();
    return f;
  }
  function sizeField(f) {
    const d = Math.min(2, window.devicePixelRatio || 1);
    f.w = f.cv.offsetWidth; f.h = f.cv.offsetHeight;
    f.cv.width = Math.round(f.w * d); f.cv.height = Math.round(f.h * d);
    f.ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function loop() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    fields.forEach((f) => {
      if (!f.cv.isConnected) { fields.delete(f); return; }
      /* Progress: eases toward 94, jumps to 100 on arrival. */
      let p;
      if (f.resolveAt) {
        p = 100;
        f.bloom = Math.min(1, (now - f.resolveAt) / 260);
      } else {
        const s = Math.max(0, (now - f.born) / 1000);
        p = Math.floor(94 * (1 - Math.exp(-s / f.tau)));
      }
      if (p !== f.p) { f.p = p; f.pct.textContent = p + '%'; }
      if (still.matches && f.drawn && !f.resolveAt) return;
      draw(f, still.matches ? 0 : now / 1000);
      f.drawn = true;
    });
    if (fields.size) loop();
  }

  function draw(f, time) {
    const { ctx, w, h } = f;
    const P = palette, t = time + f.ph, S = 10;
    const cols = Math.floor(w / S), rows = Math.floor(h / S);
    const ox = (w - (cols - 1) * S) / 2, oy = (h - (rows - 1) * S) / 2;
    const cx = 0.5 + 0.17 * Math.sin(t * 0.63), cy = 0.5 + 0.15 * Math.cos(t * 0.81);
    const cx2 = 0.5 + 0.21 * Math.cos(t * 0.47 + 1), cy2 = 0.5 + 0.19 * Math.sin(t * 0.55 + 2);
    const R = 0.3 + 0.045 * Math.sin(t * 1.3);
    const ringAt = (t * 0.45) % 1.7;
    const buckets = Array.from({ length: LEVELS }, () => []);
    const dim = [];

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = ox + i * S, y = oy + j * S, u = x / w, v = y / h;
        const d1 = Math.hypot(u - cx, v - cy) / R;
        const d2 = Math.hypot(u - cx2, v - cy2) / (R * 0.75);
        let s = Math.max(0, 1 - d1 * d1) + 0.55 * Math.max(0, 1 - d2 * d2);
        s += 0.22 * Math.max(0, 1 - Math.abs(d1 - ringAt) * 5);
        s = Math.min(1, s);
        s += f.bloom * (1 - s);
        const e = Math.min(1, Math.min(u, 1 - u, v, 1 - v) * 7);
        const lvl = s * (0.35 + 0.65 * e);
        if (lvl < 0.06) dim.push(x, y, e);
        else buckets[Math.min(LEVELS - 1, Math.floor(lvl * LEVELS))].push(x, y);
      }
    }

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = `rgba(${P.base}, ${P.baseA})`;
    ctx.beginPath();
    for (let n = 0; n < dim.length; n += 3) {
      if (dim[n + 2] < 0.15) continue;
      ctx.moveTo(dim[n] + 0.75, dim[n + 1]); ctx.arc(dim[n], dim[n + 1], 0.75, 0, Math.PI * 2);
    }
    ctx.fill();
    buckets.forEach((pts, b) => {
      if (!pts.length) return;
      const s = (b + 0.5) / LEVELS;
      const c = P.violet.map((vv, idx) => Math.round(vv + (P.blue[idx] - vv) * Math.min(1, s * 1.25)));
      const a = 0.18 + 0.82 * s;
      const r = 0.75 + 1.35 * s;
      ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      ctx.beginPath();
      for (let n = 0; n < pts.length; n += 2) { ctx.moveTo(pts[n] + r, pts[n + 1]); ctx.arc(pts[n], pts[n + 1], r, 0, Math.PI * 2); }
      ctx.fill();
    });
  }

  /* As many skeletons as make two rows at this width, never more than the
     preview: 8 in a wide chat, 4 in a narrow one, 2 on a phone. */
  function skeletonCount(body) {
    const size = parseFloat(getComputedStyle(document.documentElement).fontSize) * 16.5;
    const gap = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.85;
    const cols = Math.max(1, Math.floor((body.clientWidth + gap) / (size + gap)));
    return Math.min(PREVIEW, cols * 2);
  }

  function leadFor(list) {
    const n = list.length;
    if (!n) return `No one matches AI engineering in Egypt yet. Try a wider location, such as the whole MENA region, or a related title like <strong>ML Engineer</strong>.`;
    const placed = list.filter((c) => c.company).length;
    const reach = list.filter((c) => c.email || c.phone).length;
    return `<strong>${n} ${n === 1 ? 'person' : 'people'}</strong> match AI engineering in Egypt.
      ${placed === n ? (n === 1 ? 'They list a current company' : 'All list a current company') : `${placed} list a current company`}, and
      ${reach === n ? (n === 1 ? 'can be reached directly' : 'every one can be reached directly') : `${reach} can be reached directly`}.`;
  }

  /* ══ THE LOADING MESSAGE ═══════════════════════════════════════════════ */
  const thread = $('#thread'), scroll = $('#scroll'), input = $('#ask'), send = $('#send'), sr = $('#srStatus');
  let run = null;           // the answer currently loading
  let runSeq = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const say = (t) => { sr.textContent = t; };

  function setBusy(on) {
    if (on) { send.setAttribute('data-busy', ''); send.setAttribute('aria-label', 'Stop'); }
    else { send.removeAttribute('data-busy'); send.setAttribute('aria-label', 'Send'); }
  }

  function setStep(msg, text) {
    const slot = msg.querySelector('.ld-step');
    const next = document.createElement('span');
    next.className = 'ld-step';
    next.textContent = text;
    slot.replaceWith(next);
  }

  function start(q) {
    stop(false);
    const sc = SCENARIOS[scenario];
    const id = ++runSeq;
    const rows = ALL.slice(0, sc.count);

    document.body.setAttribute('data-thread', 'active');
    thread.insertAdjacentHTML('beforeend',
      `<div class="msg msg-user"><div class="msg-bubble">${esc(q)}</div></div>
       <div class="msg msg-aimy" data-run="${id}">
         <div class="msg-av is-working">${MARK}</div>
         <div class="msg-body" aria-busy="true">
           <div class="ld-status">${CHECK}<span class="ld-step">Reading your question</span><span class="ld-count"></span></div>
         </div>
       </div>`);
    const msg = thread.querySelector(`[data-run="${id}"]`);
    const body = msg.querySelector('.msg-body');
    msg.previousElementSibling.scrollIntoView({ block: 'start', behavior: 'smooth' });
    say('AiMY is working on it.');
    setBusy(true);

    run = { id, msg, body, rows, sc, timers: [], shown: 0, got: 0, t0: performance.now(), cells: [] };
    const at = (ms, fn) => run.timers.push(setTimeout(fn, ms));

    /* 2. Searching: the answer takes its final shape. */
    at(650, () => {
      setStep(msg, 'Searching the sourcing table');
      const k = skeletonCount(body);
      body.insertAdjacentHTML('beforeend',
        `<div class="ld-lead" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk-sheen" style="--d:0"></span></div>
         <div class="card-frame" data-frame><div class="card-frame-scroll" data-frame-scroll>
           <div class="card-grid" role="list" aria-label="Contacts, loading">
             ${Array.from({ length: k }, (_, i) =>
               `<div class="card-cell is-loading is-new" role="listitem" style="--d:${i}">${skeleton(i)}</div>`).join('')}
           </div>
         </div></div>`);
      run.cells = [...body.querySelectorAll('.card-cell')];
      const tau = sc.slowNote ? 6.5 : 1.3;
      run.cells.forEach((cell, i) => makeField(cell.querySelector('.sk-card'), i, tau));
      say('Searching the sourcing table.');

      if (sc.fail) { at(sc.fail - 650, () => fail(run)); return; }
      if (sc.slowNote) at(sc.slowNote, () => setStep(msg, 'Still searching. Larger searches take a little longer'));

      /* 3. Streaming */
      let t = sc.firstRow;
      if (!rows.length) { at(t, () => finish(run)); return; }
      rows.forEach((row, i) => {
        if (sc.holdAt && i >= sc.holdAt) return;
        at(t, () => arrive(run, row, i));
        t += rand(sc.gap[0], sc.gap[1]);
      });
      if (!sc.holdAt) at(t + 120, () => finish(run));
    });
  }

  /* A row lands: it fills the next skeleton, or adds a cell if the preview
     is wider than the skeletons drawn. Rows past the preview only count. */
  function arrive(r, row, i) {
    r.got = i + 1;
    if (r.got === 1) setStep(r.msg, 'Reading profiles');
    r.msg.querySelector('.ld-count').textContent = `${pad(r.got)} found`;
    if (i >= PREVIEW) return;

    let cell = r.cells[i];
    if (!cell) {
      r.body.querySelector('.card-grid').insertAdjacentHTML('beforeend', `<div class="card-cell is-loading" role="listitem"></div>`);
      cell = r.body.querySelector('.card-grid').lastElementChild;
      r.cells[i] = cell;
    }
    /* The card goes in under its dot field (the field stays on top), so the
       bloom can flood the dots while the card lands beneath them. The total
       is not known yet, so the index waits for the end. */
    cell.insertAdjacentHTML('afterbegin', card(row, i, r.sc.count));
    const real = cell.firstElementChild;
    real.classList.add('is-landing');
    real.querySelector('.fc-index i').textContent = '';
    const sk = cell.querySelector('.sk-card');
    if (sk) {
      if (sk._field) sk._field.resolveAt = performance.now();
      setTimeout(() => sk.classList.add('is-out'), 190);
      setTimeout(() => sk.remove(), 500);
    }
    r.shown = i + 1;
  }

  /* 4. Done: status settles, lead is written, spares fold, pill appears. */
  function finish(r, stopped) {
    if (!r || run !== r) return;
    const n = stopped ? r.got : r.rows.length;
    const secs = ((performance.now() - r.t0) / 1000).toFixed(1);
    clearTimers(r);
    r.msg.querySelector('.msg-av').classList.remove('is-working');
    r.body.removeAttribute('aria-busy');

    const status = r.msg.querySelector('.ld-status');
    status.classList.add('is-done');
    setStep(r.msg, stopped ? 'Stopped' : 'Searched the sourcing table');
    status.querySelector('.ld-count').textContent = stopped
      ? `${n} of ${r.rows.length} found · ${secs}s`
      : `${n} contact${n === 1 ? '' : 's'} · ${secs}s`;

    /* The lead replaces its two bones in place. */
    const lead = r.body.querySelector('.ld-lead');
    const text = stopped
      ? (n ? `Stopped after <strong>${n} of ${r.rows.length}</strong> contacts. Ask again to see the rest.` : `Stopped before any contacts came back. Ask again when you are ready.`)
      : leadFor(r.rows);
    const p = `<p class="ld-fade">${text}</p>`;
    if (lead) lead.outerHTML = p; else status.insertAdjacentHTML('afterend', p);

    /* Fill in each card's index now that the total is known. */
    r.body.querySelectorAll('.fc-index i').forEach((el) => { el.textContent = '/' + pad(n); });

    /* Spare skeletons fold away. */
    r.body.querySelectorAll('.card-cell').forEach((cell) => {
      if (cell.querySelector('.contact-card:not(.sk-card)')) {
        cell.classList.remove('is-loading', 'is-new');
        return;
      }
      cell.classList.add('is-gone');
      setTimeout(() => cell.remove(), 270);
    });
    const grid = r.body.querySelector('.card-grid');
    if (grid) grid.setAttribute('aria-label', 'Contacts');
    if (!r.shown) {
      const frame = r.body.querySelector('[data-frame]');
      if (frame) setTimeout(() => frame.remove(), 270);
    }

    if (!stopped && n > PREVIEW) {
      r.body.insertAdjacentHTML('beforeend', `<div class="results-more ld-fade">
        <button class="results-more-btn" type="button" data-frame-toggle aria-expanded="false"
          aria-label="Show ${n - PREVIEW} more contacts, ${n} in all"><span>Show ${n - PREVIEW} more</span>${CHEVRON}</button>
      </div>`);
      r.body.dataset.total = n;
    }
    say(stopped ? `Stopped. ${n} contacts shown.` : `${n} contacts found.`);
    setBusy(false);
    run = null;
  }

  function fail(r) {
    if (!r || run !== r) return;
    clearTimers(r);
    r.msg.querySelector('.msg-av').classList.remove('is-working');
    r.body.removeAttribute('aria-busy');
    const status = r.msg.querySelector('.ld-status');
    status.classList.add('is-done', 'is-warn');
    setStep(r.msg, 'Search did not finish');
    status.querySelector('.ld-count').textContent = '';

    r.body.querySelectorAll('.card-cell').forEach((cell) => cell.classList.add('is-gone'));
    setTimeout(() => {
      r.body.querySelector('.ld-lead')?.remove();
      r.body.querySelector('[data-frame]')?.remove();
      r.body.insertAdjacentHTML('beforeend',
        `<div class="note ld-fade">${WARN}<span>I could not reach the sourcing table, so there are no contacts to show yet. Nothing you asked for was lost.</span></div>
         <button class="results-more-btn ld-retry ld-fade" type="button" data-retry>${RETRY}<span>Try again</span></button>`);
    }, 270);
    say('The search did not finish. Try again.');
    setBusy(false);
    run = null;
  }

  function clearTimers(r) { r.timers.forEach(clearTimeout); r.timers = []; }

  /* Stop: whatever has landed stays; the rest folds away. */
  function stop(show) {
    if (!run) return;
    if (show) { finish(run, true); return; }
    clearTimers(run);
    run = null;
    setBusy(false);
  }

  /* ══ SHOW MORE (as in the handoff) ═════════════════════════════════════ */
  function setFrame(bar, expanded) {
    const body = bar.parentElement;
    const n = Number(body.dataset.total);
    const frame = body.querySelector('[data-frame]');
    const scroller = frame.querySelector('[data-frame-scroll]');
    const list = expanded ? ALL.slice(0, n) : ALL.slice(0, PREVIEW);
    scroller.innerHTML = `<div class="card-grid" role="list" aria-label="${expanded ? `All ${n} contacts` : 'Contacts'}">
      ${list.map((c, i) => `<div class="card-cell" role="listitem">${card(c, i, n)}</div>`).join('')}</div>`;
    frame.classList.toggle('is-expanded', expanded);
    if (expanded) { scroller.setAttribute('tabindex', '0'); scroller.setAttribute('role', 'region'); scroller.setAttribute('aria-label', `All ${n} contacts, scrollable`); }
    else { scroller.removeAttribute('tabindex'); scroller.removeAttribute('role'); scroller.removeAttribute('aria-label'); }
    scroller.scrollTop = 0;
    syncEdges(scroller);
    const btn = bar.querySelector('[data-frame-toggle]');
    btn.setAttribute('aria-expanded', String(expanded));
    btn.innerHTML = expanded ? `<span>Show less</span>${CHEVRON}` : `<span>Show ${n - PREVIEW} more</span>${CHEVRON}`;
    btn.setAttribute('aria-label', expanded ? `Show less. All ${n} contacts are shown` : `Show ${n - PREVIEW} more contacts, ${n} in all`);
    if (!expanded) frame.scrollIntoView({ block: 'nearest' });
  }
  function syncEdges(s) {
    const f = s.closest('[data-frame]');
    f.classList.toggle('at-top', s.scrollTop <= 1);
    f.classList.toggle('at-bottom', s.scrollTop + s.clientHeight >= s.scrollHeight - 1);
  }

  /* ══ SHELL ═════════════════════════════════════════════════════════════ */
  function paintFaq() {
    $('#faq').innerHTML = FAQ.map((q, i) => `<button class="tc-faq-item" type="button" data-ask="${esc(q)}" style="--i:${i}">
      <span class="tc-faq-q">${esc(q)}</span>
      <svg class="tc-faq-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></button>`).join('');
  }
  function paintChats() {
    const term = $('#chatSearch').value.trim().toLowerCase();
    const shown = HISTORY.filter((t) => !term || t.toLowerCase().includes(term));
    $('#chatList').innerHTML = shown.length
      ? shown.map((t) => `<button class="tc-chat" type="button">${MARK}<span>${esc(t)}</span></button>`).join('')
      : '<p class="tc-chats-empty">No chats match.</p>';
  }
  function paintProto() {
    $('#protoOpts').innerHTML = Object.entries(SCENARIOS).map(([k, s]) =>
      `<button class="proto-opt" type="button" data-scenario="${k}" aria-pressed="${k === scenario}">${s.label}</button>`).join('');
    $('#protoDesc').textContent = SCENARIOS[scenario].desc;
  }
  function replay() {
    stop(false);
    thread.innerHTML = '';
    start('Find AI engineers in Egypt');
  }
  function newChat() {
    stop(false);
    thread.innerHTML = '';
    document.body.setAttribute('data-thread', 'empty');
    closeSide();
    input.focus();
  }
  function openSide() { document.body.setAttribute('data-side', 'open'); $('#scrim').hidden = false; $('#menuBtn').setAttribute('aria-expanded', 'true'); }
  function closeSide() { document.body.removeAttribute('data-side'); $('#scrim').hidden = true; $('#menuBtn').setAttribute('aria-expanded', 'false'); }

  document.addEventListener('click', (e) => {
    const t = e.target;
    let el;
    if ((el = t.closest('[data-frame-toggle]'))) { setFrame(el.closest('.results-more'), el.getAttribute('aria-expanded') !== 'true'); return; }
    if ((el = t.closest('[data-retry]'))) { const q = el.closest('.msg').previousElementSibling.textContent; start(q.trim()); return; }
    if ((el = t.closest('[data-ask]'))) { start(el.getAttribute('data-ask')); return; }
    if ((el = t.closest('[data-scenario]'))) { scenario = el.getAttribute('data-scenario'); paintProto(); replay(); return; }
    if (t.closest('#replay')) { replay(); return; }
    if (t.closest('#protoBtn')) {
      const pop = $('#protoPop'), open = pop.hidden;
      pop.hidden = !open; $('#protoBtn').setAttribute('aria-expanded', String(open));
      return;
    }
    if (t.closest('#newChat')) { newChat(); return; }
    if (t.closest('#menuBtn')) { openSide(); return; }
    if (t.closest('#scrim')) { closeSide(); return; }
    if (t.closest('#themeBtn')) {
      const light = document.documentElement.getAttribute('data-theme') !== 'light';
      if (light) document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('aimy-talent-theme', light ? 'light' : 'dark'); } catch (err) {}
      readPalette();
      fields.forEach((f) => { f.drawn = false; });
      loop();
    }
  });

  /* While AiMY works, the button is Stop; otherwise it sends. */
  $('#composer').addEventListener('submit', (e) => {
    e.preventDefault();
    if (run) { stop(true); return; }
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    start(q);
  });
  $('#chatSearch').addEventListener('input', paintChats);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.body.getAttribute('data-side') === 'open') closeSide();
      else if (!$('#protoPop').hidden) { $('#protoPop').hidden = true; $('#protoBtn').setAttribute('aria-expanded', 'false'); }
    }
  });
  document.addEventListener('scroll', (e) => {
    const t = e.target;
    if (t.nodeType === 1 && t.hasAttribute('data-frame-scroll')) syncEdges(t);
  }, true);

  readPalette();
  paintFaq();
  paintChats();
  paintProto();
  if (window.AimyScroll) {
    window.AimyScroll.attach(scroll, { track: true, latest: true });
    const side = window.AimyScroll.attach($('#chatList'));
    if (side && side.rail) side.rail.classList.add('dot-on-scroll');
  }
  replay();
})();
</script>
</body>
</html>
